<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stevanović Admin</title>
<style>
:root{--ox:#180609;--wine:#2c0b12;--paper:#f7f3ed;--ivory:#efe8dc;--gold:#c5a66a;--ink:#12100e;--muted:#777067;--line:rgba(20,15,12,.13);--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{height:68px;background:var(--ox);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-family:var(--serif);letter-spacing:.22em;font-size:18px}.top small{letter-spacing:.14em;color:#d7c7a7}.top-actions{display:flex;gap:10px}.ghost{border:1px solid rgba(255,255,255,.28);background:transparent;color:white;padding:10px 14px;font-size:11px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:24px 18px;background:#f2ece4;position:sticky;top:68px;height:calc(100vh - 68px)}aside button{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;margin:2px 0;font-size:12px;color:#4e4943}aside button.active{background:var(--ox);color:white}main{padding:34px;max-width:1400px;width:100%}.eyebrow{font-size:10px;letter-spacing:.2em;color:#8b7b65;font-weight:700}.page-title{font-family:var(--serif);font-weight:400;font-size:44px;margin:7px 0 28px}.panel{background:white;border:1px solid var(--line);padding:22px;margin-bottom:22px}.panel h2{font-family:var(--serif);font-weight:400;margin:0 0 16px;font-size:26px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:#fff;border:1px solid var(--line);padding:20px}.stat strong{display:block;font-family:var(--serif);font-size:34px;font-weight:400}.stat span{font-size:11px;color:var(--muted)}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:middle}.table th{font-size:9px;letter-spacing:.13em;color:#766b60}.thumb{width:58px;height:58px;object-fit:cover;background:#eee8df}.pill{display:inline-block;padding:5px 8px;background:#eee6d9;font-size:9px;letter-spacing:.08em}.btn{border:0;background:var(--ox);color:white;padding:11px 15px;font-size:10px;letter-spacing:.1em;font-weight:700}.btn.light{background:#e8decd;color:#1d1813}.btn.out{background:white;color:#1d1813;border:1px solid var(--line)}.danger{color:#8e1c2b}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:16px}.toolbar .right{display:flex;gap:8px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:9px;letter-spacing:.13em;color:#756a5f;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #d8d0c7;background:#fff;padding:11px 12px;outline:none}.field textarea{min-height:110px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.form-grid .full{grid-column:1/-1}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:210px;overflow:auto;border:1px solid var(--line);padding:10px}.checks label{font-size:11px;padding:7px;background:#faf8f4}.notice{padding:14px 16px;background:#fff6df;border-left:3px solid var(--gold);font-size:12px;line-height:1.55;margin-bottom:20px}.review{border:1px solid var(--line);padding:15px;margin-bottom:10px;background:white}.review-head{display:flex;justify-content:space-between;gap:12px}.stars{color:#9a7539;letter-spacing:.08em}.muted{color:var(--muted);font-size:11px}.review-images{display:flex;gap:7px;margin-top:10px}.review-images img{width:72px;height:72px;object-fit:cover}.blog-card{border:1px solid var(--line);padding:16px;margin-bottom:10px;background:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.auth-wrap{min-height:100vh;background:linear-gradient(135deg,#100607,#2b0910);display:grid;place-items:center;padding:24px}.auth-card{width:min(460px,100%);background:#faf7f2;padding:34px;border:1px solid rgba(197,166,106,.4);box-shadow:0 30px 90px rgba(0,0,0,.35)}.auth-card h1{font-family:var(--serif);font-weight:400;font-size:38px;margin:5px 0 8px}.auth-card p{color:var(--muted);font-size:12px;line-height:1.5}.auth-card .btn{width:100%;margin-top:6px}.error{color:#9a2534;font-size:12px;min-height:18px}.success{color:#476b46;font-size:12px}.jsonbox{width:100%;min-height:260px;font-family:monospace;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:20px;z-index:60}.modal-card{background:var(--paper);width:min(880px,100%);max-height:92vh;overflow:auto;padding:26px;position:relative}.close{position:absolute;right:17px;top:14px;border:0;background:transparent;font-size:24px}.modal-card h2{font-family:var(--serif);font-size:34px;font-weight:400;margin:0 0 20px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow:auto;gap:4px;padding:10px}aside button{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,1fr)}main{padding:20px}.form-grid{grid-template-columns:1fr}.checks{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="eyebrow">PRIVATNI ADMIN PANEL</div>
    <h1>Zlatara Stevanović</h1>
    <p id="authIntro">Prijavite se da uređujete proizvode, preporuke, recenzije i blog.</p>
    <div class="field"><label>IME I PREZIME</label><input id="authName" autocomplete="name"></div>
    <div class="field"><label>EMAIL</label><input id="authEmail" type="email" autocomplete="email"></div>
    <div class="field"><label>LOZINKA</label><input id="authPass" type="password" autocomplete="current-password"></div>
    <div id="authError" class="error"></div>
    <button class="btn" id="authBtn">PRIJAVI SE</button>
    <p id="setupNote" class="muted"></p>
  </div>
</div>

<div id="app" class="hidden">
  <div class="top"><div><div class="brand">STEVANOVIĆ</div><small>ADMINISTRACIJA</small></div><div class="top-actions"><a class="ghost" href="index.html#shop" target="_blank">OTVORI PRODAVNICU</a><button class="ghost" onclick="logoutAdmin()">ODJAVI SE</button></div></div>
  <div class="shell">
    <aside>
      <button data-tab="dashboard" class="active">Pregled</button>
      <button data-tab="products">Proizvodi</button>
      <button data-tab="recommendations">Preporuke</button>
      <button data-tab="homepage">Početna / raspored</button>
      <button data-tab="reviews">Recenzije</button>
      <button data-tab="blogs">Blog</button>
      <button data-tab="data">Backup podataka</button>
    </aside>
    <main>
      <section id="tab-dashboard" class="tab-page"></section>
      <section id="tab-products" class="tab-page hidden"></section>
      <section id="tab-recommendations" class="tab-page hidden"></section>
      <section id="tab-homepage" class="tab-page hidden"></section>
      <section id="tab-reviews" class="tab-page hidden"></section>
      <section id="tab-blogs" class="tab-page hidden"></section>
      <section id="tab-data" class="tab-page hidden"></section>
    </main>
  </div>
</div>
<div id="modal" class="modal hidden"></div>
<script src="cms-store.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return Number.isFinite(Number(v))&&v!==''?new Intl.NumberFormat('sr-RS').format(Number(v))+' RSD':'Cena uskoro'}
function currentAdmin(){const u=ZSCMS.currentUser();return u&&u.role==='admin'?u:null}
function showApp(){ $('#auth').classList.add('hidden');$('#app').classList.remove('hidden');renderAll(); }
function showAuth(){ $('#auth').classList.remove('hidden');$('#app').classList.add('hidden'); const setup=!ZSCMS.hasAdmin(); $('#authName').closest('.field').classList.toggle('hidden',!setup); $('#authBtn').textContent=setup?'KREIRAJ VLASNIČKI NALOG':'PRIJAVI SE'; $('#authIntro').textContent=setup?'Prvo postavljanje: napravite vlasnički nalog za ovaj admin panel.':'Prijavite se da uređujete prodavnicu.'; $('#setupNote').textContent=setup?'Ovaj trenutni prototip čuva nalog i izmene u pregledaču. Za pravi rad sa više uređaja i kupaca potrebno je povezati bazu/autentifikaciju.':''; }
async function handleAuth(){const e=$('#authEmail').value,p=$('#authPass').value,n=$('#authName').value;$('#authError').textContent='';try{if(!ZSCMS.hasAdmin()) await ZSCMS.createFirstAdmin({name:n,email:e,password:p}); else {const u=await ZSCMS.login(e,p);if(u.role!=='admin'){ZSCMS.logout();throw new Error('Ovaj nalog nema admin pristup.')}}showApp()}catch(err){$('#authError').textContent=err.message}}
$('#authBtn').onclick=handleAuth; $('#authPass').addEventListener('keydown',e=>{if(e.key==='Enter')handleAuth()});
function logoutAdmin(){ZSCMS.logout();showAuth()}

$$('aside button').forEach(b=>b.onclick=()=>{ $$('aside button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.tab-page').forEach(x=>x.classList.add('hidden'));$('#tab-'+b.dataset.tab).classList.remove('hidden');renderTab(b.dataset.tab)});
function renderAll(){['dashboard','products','recommendations','homepage','reviews','blogs','data'].forEach(renderTab)}
function renderTab(name){({dashboard:renderDashboard,products:renderProducts,recommendations:renderRecommendations,homepage:renderHomepage,reviews:renderReviews,blogs:renderBlogs,data:renderData}[name]||(()=>{}))()}

function renderDashboard(){const p=ZSCMS.products(),r=ZSCMS.allReviews(),b=ZSCMS.blogs();$('#tab-dashboard').innerHTML=`<div class="eyebrow">KONTROLNI CENTAR</div><h1 class="page-title">Pregled prodavnice</h1><div class="grid"><div class="stat"><strong>${p.length}</strong><span>proizvoda</span></div><div class="stat"><strong>${p.filter(x=>x.available).length}</strong><span>aktivno za kupovinu</span></div><div class="stat"><strong>${r.filter(x=>!x.hidden).length}</strong><span>vidljivih recenzija</span></div><div class="stat"><strong>${b.filter(x=>x.published).length}</strong><span>objavljenih blogova</span></div></div><div class="panel" style="margin-top:22px"><h2>Šta ovde kontrolišete</h2><p class="muted" style="font-size:13px;line-height:1.7">Nazive, cene, opise, tehničke podatke, fotografije i dostupnost proizvoda; ručne preporuke uz svaki komad; editorial raspored na kategoriji „Sve”; recenzije i fotografije kupaca; kao i blog sadržaj.</p></div>`}

function renderProducts(){const p=ZSCMS.products();$('#tab-products').innerHTML=`<div class="eyebrow">KATALOG</div><div class="toolbar"><h1 class="page-title" style="margin:5px 0">Proizvodi</h1><div class="right"><button class="btn" onclick="editProduct()">＋ NOVI PROIZVOD</button></div></div><div class="panel"><table class="table"><thead><tr><th>SLIKA</th><th>PROIZVOD</th><th>KATEGORIJA</th><th>CENA</th><th>STATUS</th><th></th></tr></thead><tbody>${p.map(x=>`<tr><td>${x.image?`<img class="thumb" src="${x.image}" onerror="this.style.opacity=.15">`:'—'}</td><td><strong>${esc(x.name)}</strong><div class="muted">${esc(x.material)}</div></td><td>${esc(x.cat)}</td><td>${money(x.price)}</td><td><span class="pill">${x.available?'Aktivno':'Uskoro'}</span></td><td><button class="btn out" onclick="editProduct(${x.id})">UREDI</button></td></tr>`).join('')}</tbody></table></div>`}
function editProduct(id){const p=id?ZSCMS.getProduct(id):{id:Date.now(),name:'',cat:'Prstenje',price:null,available:false,badge:'Novo',material:'',fine:'',weight:'',size:'',desc:'',image:'',hover:'',orientation:'vertical',recommendations:[]};$('#modal').innerHTML=`<div class="modal-card"><button class="close" onclick="closeModal()">×</button><h2>${id?'Uredi proizvod':'Novi proizvod'}</h2><form id="productForm"><div class="form-grid"><div class="field"><label>NAZIV</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>KATEGORIJA</label><select name="cat">${['Ogrlice','Prstenje','Minđuše','Narukvice','Setovi'].map(c=>`<option ${p.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>CENA RSD</label><input name="price" type="number" value="${p.price??''}" placeholder="ostavite prazno za Cena uskoro"></div><div class="field"><label>BADGE</label><input name="badge" value="${esc(p.badge||'')}"></div><div class="field"><label>MATERIJAL</label><input name="material" value="${esc(p.material||'')}"></div><div class="field"><label>FINOĆA</label><input name="fine" value="${esc(p.fine||'')}"></div><div class="field"><label>TEŽINA</label><input name="weight" value="${esc(p.weight||'')}"></div><div class="field"><label>DIMENZIJE / VELIČINA</label><input name="size" value="${esc(p.size||'')}"></div><div class="field"><label>GLAVNA SLIKA — naziv fajla</label><input name="image" value="${esc(p.image||'')}" placeholder="npr. Cruor.jpg"></div><div class="field"><label>HOVER SLIKA</label><input name="hover" value="${esc(p.hover||'')}"></div><div class="field"><label>FORMAT</label><select name="orientation"><option value="vertical" ${p.orientation!=='horizontal'?'selected':''}>Uspravno 4:5</option><option value="horizontal" ${p.orientation==='horizontal'?'selected':''}>Horizontalno 16:9</option></select></div><div class="field"><label>DOSTUPNOST</label><select name="available"><option value="false" ${!p.available?'selected':''}>Cena / kupovina uskoro</option><option value="true" ${p.available?'selected':''}>Može da se kupi</option></select></div><div class="field full"><label>OPIS</label><textarea name="desc">${esc(p.desc||'')}</textarea></div></div><div class="row"><button class="btn" type="submit">SAČUVAJ</button>${id?`<button type="button" class="btn out danger" onclick="removeProduct(${p.id})">SAKRIJ PROIZVOD</button>`:''}</div></form></div>`;$('#modal').classList.remove('hidden');$('#productForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);const obj={...p,name:f.get('name').trim(),cat:f.get('cat'),price:f.get('price')===''?null:Number(f.get('price')),badge:f.get('badge').trim(),material:f.get('material').trim(),fine:f.get('fine').trim(),weight:f.get('weight').trim(),size:f.get('size').trim(),image:f.get('image').trim(),hover:f.get('hover').trim(),orientation:f.get('orientation'),available:f.get('available')==='true',desc:f.get('desc').trim()};ZSCMS.upsertProduct(obj);closeModal();renderProducts();renderDashboard()}}
function removeProduct(id){if(confirm('Sakriti ovaj proizvod iz kataloga?')){ZSCMS.deleteProduct(id);closeModal();renderProducts()}}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}

function renderRecommendations(){const p=ZSCMS.products();$('#tab-recommendations').innerHTML=`<div class="eyebrow">CROSS-SELL / PAIRING</div><h1 class="page-title">Preporuke uz proizvod</h1><div class="notice">Ručni izbor ima prioritet. Ako stavite manje od četiri proizvoda, prodavnica automatski dopunjava predloge prema materijalu, kategoriji i cenovnom rangu.</div><div class="panel"><div class="field"><label>IZABERITE PROIZVOD</label><select id="recProduct">${p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div id="recChecks"></div></div>`;$('#recProduct').onchange=renderRecChecks;renderRecChecks()}
function renderRecChecks(){const id=Number($('#recProduct').value),active=ZSCMS.getProduct(id),p=ZSCMS.products().filter(x=>x.id!==id);$('#recChecks').innerHTML=`<div class="field"><label>ŠTA DA SE PRIKAŽE KAO „UPOTPUNITE IZBOR”</label><div class="checks">${p.map(x=>`<label><input type="checkbox" value="${x.id}" ${(active.recommendations||[]).includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}</div></div><button class="btn" onclick="saveRecommendations(${id})">SAČUVAJ PREPORUKE</button>`}
function saveRecommendations(id){const ids=[...$('#recChecks').querySelectorAll('input:checked')].map(x=>Number(x.value)).slice(0,8),p=ZSCMS.getProduct(id);ZSCMS.upsertProduct({...p,recommendations:ids});alert('Preporuke su sačuvane.')}

function renderHomepage(){const s=ZSCMS.settings(),p=ZSCMS.products();const opts=ids=>ids.map(id=>p.find(x=>x.id===id)).filter(Boolean).map(x=>esc(x.name)).join(', ');$('#tab-homepage').innerHTML=`<div class="eyebrow">EDITORIAL GRID</div><h1 class="page-title">Raspored kategorije „Sve”</h1><div class="notice">Na desktopu prva kolona sadrži dve horizontalne narukvice jednu ispod druge. Pored njih stoje tri vertikalna proizvoda. Kada kupac filtrira kategoriju, vraća se pravilan katalog-grid.</div><div class="panel"><h2>Prva kolona — dve narukvice</h2><div class="form-grid"><div class="field"><label>GORNJA</label><select id="brace1">${p.filter(x=>x.cat==='Narukvice').map(x=>`<option value="${x.id}" ${s.editorialBracelets?.[0]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>DONJA</label><select id="brace2">${p.filter(x=>x.cat==='Narukvice').map(x=>`<option value="${x.id}" ${s.editorialBracelets?.[1]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div><h2 style="margin-top:24px">Tri velika proizvoda pored</h2><div class="form-grid">${[0,1,2].map(i=>`<div class="field"><label>POZICIJA ${i+1}</label><select id="vert${i}">${p.filter(x=>x.cat!=='Narukvice').map(x=>`<option value="${x.id}" ${s.editorialVertical?.[i]===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`).join('')}</div><button class="btn" onclick="saveHomepage()">SAČUVAJ RASPORED</button><p class="muted">Trenutno: ${opts(s.editorialBracelets||[])} | ${opts(s.editorialVertical||[])}</p></div>`}
function saveHomepage(){ZSCMS.updateSettings({editorialBracelets:[Number($('#brace1').value),Number($('#brace2').value)],editorialVertical:[0,1,2].map(i=>Number($('#vert'+i).value))});alert('Raspored je sačuvan.')}

function renderReviews(){const r=ZSCMS.allReviews(),p=ZSCMS.products();$('#tab-reviews').innerHTML=`<div class="eyebrow">UTISCI KUPACA</div><div class="toolbar"><h1 class="page-title" style="margin:5px 0">Recenzije</h1><button class="btn" onclick="storeReview()">＋ UNESI UTISAK KUPCA IZ RADNJE</button></div><div class="notice">Možete sakriti recenziju sa sajta. Ako unosite komentar u ime kupca iz fizičke radnje, unos treba da bude stvarni utisak kupca uz njegovu saglasnost; na sajtu se prikazuje kao „Kupovina u radnji”.</div>${r.length?r.map(x=>`<div class="review" style="opacity:${x.hidden?.55:1}"><div class="review-head"><div><strong>${esc(x.userName)}</strong> <span class="stars">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span><div class="muted">${esc(p.find(y=>y.id===x.productId)?.name||'Proizvod')} · ${x.source==='store-customer'?'Kupovina u radnji':'Online utisak'} · ${new Date(x.createdAt).toLocaleDateString('sr-RS')}</div></div><div class="row"><button class="btn out" onclick="toggleReview('${x.id}',${!x.hidden})">${x.hidden?'PRIKAŽI':'SAKRIJ'}</button><button class="btn out danger" onclick="removeReview('${x.id}')">OBRIŠI</button></div></div><p>${esc(x.text)}</p>${x.images?.length?`<div class="review-images">${x.images.map(i=>`<img src="${i}">`).join('')}</div>`:''}</div>`).join(''):'<div class="panel"><p class="muted">Još nema recenzija.</p></div>'}`}
function toggleReview(id,h){ZSCMS.setReviewHidden(id,h);renderReviews()}function removeReview(id){if(confirm('Obrisati recenziju?')){ZSCMS.deleteReview(id);renderReviews()}}
function storeReview(){const p=ZSCMS.products();$('#modal').innerHTML=`<div class="modal-card"><button class="close" onclick="closeModal()">×</button><h2>Utisak kupca iz radnje</h2><form id="storeReviewForm"><div class="field"><label>PROIZVOD</label><select name="product">${p.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>IME KUPCA / INICIJALI</label><input name="name" required placeholder="npr. Jelena M."></div><div class="field"><label>OCENA</label><select name="rating">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="field"><label>STVARNI UTISAK KUPCA</label><textarea name="text" required></textarea></div><label style="display:flex;gap:8px;font-size:12px;line-height:1.5"><input type="checkbox" name="consent" required> Potvrđujem da je ovo stvarni utisak kupca i da imam njegovu saglasnost za objavljivanje.</label><br><button class="btn">OBJAVI UTISAK</button></form></div>`;$('#modal').classList.remove('hidden');$('#storeReviewForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);ZSCMS.addReview({productId:Number(f.get('product')),rating:Number(f.get('rating')),text:f.get('text'),customerName:f.get('name'),source:'store-customer'});closeModal();renderReviews()}}

function renderBlogs(){const b=ZSCMS.blogs();$('#tab-blogs').innerHTML=`<div class="eyebrow">SADRŽAJ</div><div class="toolbar"><h1 class="page-title" style="margin:5px 0">Blog</h1><button class="btn" onclick="editBlog()">＋ NOVI TEKST</button></div>${b.map(x=>`<div class="blog-card"><div class="review-head"><div><strong>${esc(x.title)}</strong><div class="muted">${x.published?'Objavljeno':'Nacrt'} · /${esc(x.slug)}</div></div><button class="btn out" onclick="editBlog('${x.id}')">UREDI</button></div><p class="muted">${esc(x.excerpt||'')}</p></div>`).join('')}`}
function editBlog(id){const b=id?ZSCMS.blogs().find(x=>x.id===id):{id:'b_'+Date.now().toString(36),title:'',slug:'',excerpt:'',body:'',image:'',published:false,createdAt:new Date().toISOString()};$('#modal').innerHTML=`<div class="modal-card"><button class="close" onclick="closeModal()">×</button><h2>${id?'Uredi tekst':'Novi blog'}</h2><form id="blogForm"><div class="field"><label>NASLOV</label><input name="title" value="${esc(b.title)}" required></div><div class="field"><label>SLUG</label><input name="slug" value="${esc(b.slug)}" placeholder="npr. vodic-za-prstenje"></div><div class="field"><label>KRATAK UVOD</label><textarea name="excerpt">${esc(b.excerpt||'')}</textarea></div><div class="field"><label>TEKST</label><textarea name="body" style="min-height:260px">${esc(b.body||'')}</textarea></div><div class="field"><label>NASLOVNA SLIKA — naziv fajla</label><input name="image" value="${esc(b.image||'')}"></div><label style="font-size:12px"><input type="checkbox" name="published" ${b.published?'checked':''}> Objavljeno</label><br><br><button class="btn">SAČUVAJ</button></form></div>`;$('#modal').classList.remove('hidden');$('#blogForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget);ZSCMS.upsertBlog({...b,title:f.get('title').trim(),slug:(f.get('slug').trim()||f.get('title').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')),excerpt:f.get('excerpt').trim(),body:f.get('body').trim(),image:f.get('image').trim(),published:f.get('published')==='on'});closeModal();renderBlogs();renderDashboard()}}

function renderData(){$('#tab-data').innerHTML=`<div class="eyebrow">BACKUP / PRENOS</div><h1 class="page-title">Podaci prodavnice</h1><div class="notice">Dok se ne poveže centralna baza, ovaj admin prototip čuva izmene u ovom pregledaču. Export čuva proizvode, preporuke, blogove, korisnike i recenzije kao JSON backup.</div><div class="panel"><h2>Export</h2><button class="btn" onclick="downloadBackup()">PREUZMI BACKUP</button></div><div class="panel"><h2>Import</h2><textarea class="jsonbox" id="importBox" placeholder="Nalepite sadržaj backup JSON fajla"></textarea><br><br><button class="btn" onclick="importBackup()">UVEZI PODATKE</button></div>`}
function downloadBackup(){const blob=new Blob([ZSCMS.exportState()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stevanovic-cms-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importBackup(){try{ZSCMS.importState($('#importBox').value);alert('Podaci su uvezeni.');renderAll()}catch(e){alert(e.message)}}

window.addEventListener('zs:cms-updated',()=>{});
if(currentAdmin())showApp();else showAuth();
</script>
</body>
</html>
