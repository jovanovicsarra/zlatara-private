<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stevanović Admin</title>
<style>html,body,#adminFrame{width:100%;height:100%;margin:0;border:0;background:#f7f3ed}body{overflow:hidden}</style>
</head>
<body>
<iframe id="adminFrame" src="admin.html" title="Stevanović administracija"></iframe>
<script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    if(typeof w.showApp==='function') w.showApp();
  }catch(e){ console.error(e); }
});
</script>
</body>
</html>
