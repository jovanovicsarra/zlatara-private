name: Clean legal notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/clean-legal-notes.yml'
      - '.github/scripts/clean_legal_notes.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/clean_legal_notes.py
      - run: |
          rm -f .github/workflows/clean-legal-notes.yml .github/scripts/clean_legal_notes.py
          git config user.name "Zlatara site updater"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/clean-legal-notes.yml .github/scripts/clean_legal_notes.py
          git commit -m "Očisti tekstove checkout pravila"
          git push origin main
