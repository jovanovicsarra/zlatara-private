name: Add Cruor product

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-cruor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Cruor product to catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'name:"Prsten Cruor"' in s:
              print('Prsten Cruor already present; nothing to do.')
              raise SystemExit(0)
          marker = '  const products = [\n'
          if marker not in s:
              raise SystemExit('Products array marker not found')
          cruor = '    {id:13,name:"Prsten Cruor",cat:"Prstenje",price:null,available:false,badge:"Novo",material:"Zlato",fine:"Podaci uskoro",weight:"Podaci uskoro",size:"Podaci uskoro",desc:"Prsten izražajnog karaktera sa duboko crvenim centralnim kamenom i toplinom žutog zlata. Fotografija prikazuje stvarni model; tehnički podaci i cena biće uneti pre aktivacije online kupovine.",image:"Cruor.jpg",hover:""},\n'
          s = s.replace(marker, marker + cruor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit catalog update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Dodaj Prsten Cruor u katalog"
          git push
