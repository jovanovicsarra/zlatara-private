name: Add Ondina product

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-ondina.yml'
      - '.github/scripts/add_ondina.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/add_ondina.py
      - run: |
          rm -f .github/workflows/add-ondina.yml .github/scripts/add_ondina.py
          git config user.name "Zlatara site updater"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/add-ondina.yml .github/scripts/add_ondina.py
          git commit -m "Dodaj Ogrlicu Ondina u online katalog"
          git push origin main
