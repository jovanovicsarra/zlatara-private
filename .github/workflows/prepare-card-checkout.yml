name: Prepare card checkout

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-card-checkout.yml'
      - '.github/scripts/patch_checkout.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch checkout
        run: python .github/scripts/patch_checkout.py

      - name: Commit changes
        run: |
          rm -f .github/workflows/prepare-card-checkout.yml
          rm -f .github/scripts/patch_checkout.py
          git config user.name "Zlatara site updater"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/prepare-card-checkout.yml .github/scripts/patch_checkout.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Pripremi checkout za sigurno kartično plaćanje"
          git push origin main
