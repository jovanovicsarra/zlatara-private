name: Add Balustrade bracelet

on:
  push:
    paths:
      - '.github/workflows/add-balustrade-product.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Balustrade product and bracelet layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Add Balustrade as a real product only once.
          marker = '  const products = [\n'
          product = '    {id:14,name:"Narukvica Balustrade",cat:"Narukvice",price:null,available:false,badge:"Novo",material:"Podaci uskoro",fine:"Podaci uskoro",weight:"Podaci uskoro",size:"Podaci uskoro",desc:"Narukvica prepoznatljivog geometrijskog ritma sa ponavljajućim lučnim segmentima i dvobojnim izgledom. Fotografija prikazuje stvarni model; tehnički podaci i cena biće uneti pre aktivacije online kupovine.",image:"Balustrade.jpg",hover:""},\n'
          if 'name:"Narukvica Balustrade"' not in text:
              if marker not in text:
                  raise SystemExit('Products marker not found')
              text = text.replace(marker, marker + product, 1)

          # 2) Give bracelet cards their own horizontal visual language.
          old_css = '''    .pic{\n      background:#f0eee9;\n      aspect-ratio:4/5;\n    }'''
          new_css = '''    .pic{\n      background:#f0eee9;\n      aspect-ratio:4/5;\n    }\n\n    /* Narukvice su namerno horizontalne: proizvod ostaje ceo i fotografija\n       izgleda kao editorial kadar, dok prstenje i ogrlice ostaju uspravni. */\n    .card.bracelet-card .pic{\n      aspect-ratio:16/9;\n      background:#f3ede2;\n    }\n    .card.bracelet-card .pic .product-photo,\n    .card.bracelet-card .pic .product-photo-hover{\n      object-fit:cover;\n      object-position:center center;\n    }\n    .modal-image.bracelet-modal{\n      background:#f3ede2;\n    }\n    .modal-image.bracelet-modal img{\n      object-fit:contain;\n      object-position:center center;\n      padding:4%;\n    }'''
          if '.card.bracelet-card .pic{' not in text:
              if old_css not in text:
                  raise SystemExit('Editorial pic CSS marker not found')
              text = text.replace(old_css, new_css, 1)

          # 3) Add category-aware class to cards.
          old_card = '<article class="card">'
          new_card = '<article class="card ${p.cat==="Narukvice" ? "bracelet-card" : ""}">'
          if new_card not in text:
              if old_card not in text:
                  raise SystemExit('Card template marker not found')
              text = text.replace(old_card, new_card, 1)

          # 4) Make the product modal horizontal-friendly for bracelets too.
          old_modal = '    modalImage.classList.toggle("has-image",!!p.image);\n    modalImage.innerHTML = p.image ? safeImageHTML(p.image,"",p.name) : "";'
          new_modal = '    modalImage.classList.toggle("has-image",!!p.image);\n    modalImage.classList.toggle("bracelet-modal",p.cat==="Narukvice");\n    modalImage.innerHTML = p.image ? safeImageHTML(p.image,"",p.name) : "";'
          if 'modalImage.classList.toggle("bracelet-modal"' not in text:
              if old_modal not in text:
                  raise SystemExit('Modal image marker not found')
              text = text.replace(old_modal, new_modal, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Balustrade bracelet and horizontal bracelet photos"
            git push
          fi