name: Shift Ondina modal image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/shift-ondina-modal.yml'
      - '.github/scripts/shift_ondina_modal.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python .github/scripts/shift_ondina_modal.py
      - run: |
          rm -f .github/workflows/shift-ondina-modal.yml .github/scripts/shift_ondina_modal.py
          git config user.name "Zlatara site updater"
          git config user.email "actions@github.com"
          git add index.html .github/workflows/shift-ondina-modal.yml .github/scripts/shift_ondina_modal.py
          git commit -m "Pomeri Ondinu ulevo i prikaži celu ogrlicu"
          git push origin main
