name: Point admin links to direct panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/point-admin-links-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update admin links
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('href="admin.html">Admin</a>', 'href="admin-direct.html">Admin</a>')
          text = text.replace('href="admin.html">OTVORI ADMIN</a>', 'href="admin-direct.html">OTVORI ADMIN</a>')
          p.write_text(text, encoding='utf-8')
      - name: Commit link update
        run: |
          if git diff --quiet; then
            echo 'Admin links already point to direct panel.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Open admin panel directly during development'
          git push
